global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tmos-dev'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:3001']
        labels:
          service: 'auth'

  - job_name: 'reporter-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['reporter-service:3002']
        labels:
          service: 'reporter'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:5672']
