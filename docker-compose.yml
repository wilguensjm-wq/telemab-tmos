services:
  postgres:
    image: postgres:16-alpine
    container_name: tmos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tmos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tmos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tmos"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    container_name: tmos-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"    # WebSocket (ws://)
      - "7881:7881"    # HTTP API
      - "7882:7882"    # Prometheus metrics
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret
      - LIVEKIT_HOST=livekit
      - LIVEKIT_PORT=7880
      - LIVEKIT_LOG_LEVEL=info
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: --dev --config /etc/livekit.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tmos

  # Backend service (commented for docker-compose only - runs via npm start locally)
  # backend:
  #   build: ./backend
  #   container_name: tmos-backend
  #   restart: unless-stopped
