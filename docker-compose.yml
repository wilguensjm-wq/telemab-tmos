  #       condition: service_healthy
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     - TMOS_DATABASE_URL=postgres://postgres:postgres@postgres:5432/tmos
  #     - TMOS_MEDIA_LIVEKIT_ENABLED=true
  #     - TMOS_MEDIA_LIVEKIT_WS_URL=ws://livekit:7880
  #     - TMOS_MEDIA_LIVEKIT_API_KEY=devkey
  #     - TMOS_MEDIA_LIVEKIT_API_SECRET=devsecret
  #   networks:
  #     - tmos

volumes:
  tmos_postgres_data:

networks:
  tmos:
    driver: bridge
